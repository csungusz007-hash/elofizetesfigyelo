name: APK build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Kicsomagolas
        run: unzip -o ElofizetesFigyelo.zip

      - name: Debug APK
        working-directory: ElofizetesFigyelo
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Release APK
        continue-on-error: true
        working-directory: ElofizetesFigyelo
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Elofizetes-figyelo-APK
          path: ElofizetesFigyelo/app/build/outputs/apk/**/*.apk
